# Lean monitoring stack for the IMS host (run alongside docker-compose.prod.yml).
#
#   docker compose -f docker-compose.monitoring.yml up -d
#
# Three small, independent tools:
#
#   * uptime-kuma — synthetic uptime checks + ALERTING. This is the highest-value
#     piece: point a monitor at https://<your-domain>/ims/api/ping (expects body
#     "ack") and at the public URL, and wire a notification (email / Slack / ntfy
#     / web push) that leaves the host so a full host-down still reaches you. This
#     is what would have paged you the instant the 2026-06-28 502 began.
#   * dozzle — real-time browser log tailing for every container.
#   * beszel — host + per-container CPU / memory / disk dashboard with its own
#     alerts (hub UI + an agent that gathers stats).
#
# Security posture:
#   * No container mounts the raw /var/run/docker.sock. dozzle and the beszel
#     agent read container info/logs/stats through `docker-socket-proxy`, a
#     hardened, READ-ONLY Docker-API proxy that only exposes GET endpoints — the
#     raw socket is root-equivalent control of the host, so we keep it behind one
#     audited chokepoint that runs no app code and is reachable only on the
#     internal `monitoring` network.
#   * Nothing publishes host ports. The web UIs are reached only through Caddy on
#     the shared external `web` network — put them on internal-only subdomains and
#     PROTECT THEM with Caddy basic_auth (they expose logs and metrics). See
#     deploy/Caddyfile.example.
#   * The beszel agent is NOT on the host network (so its port is never exposed on
#     a host interface) and is gated behind the `agent` profile, so it starts only
#     after you've set its auth KEY (see below).
#
# All restart unless-stopped so they survive the nightly reboot. An on-host
# monitor can't see a fully dead host — keep the Kuma notification channel
# off-host, and ideally add one external check hitting the public URL as a backstop.

services:

  uptime-kuma:
    image: "louislam/uptime-kuma:1"
    container_name: "uptime-kuma"
    restart: unless-stopped
    volumes:
      - uptime-kuma-data:/app/data
    networks:
      - web

  # Hardened read-only Docker-API proxy. dozzle and the beszel agent talk to this
  # instead of mounting docker.sock directly. Only the GET endpoints they need are
  # enabled; everything mutating (POST/exec/secrets/…) stays off (default 0).
  docker-socket-proxy:
    image: "tecnativa/docker-socket-proxy:latest"
    container_name: "docker-socket-proxy"
    restart: unless-stopped
    environment:
      CONTAINERS: "1"   # list + inspect + logs + stats (read)
      IMAGES: "1"
      NETWORKS: "1"
      INFO: "1"
      PING: "1"
      VERSION: "1"
      POST: "0"         # no mutating calls
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - monitoring

  dozzle:
    image: "amir20/dozzle:latest"
    container_name: "dozzle"
    restart: unless-stopped
    environment:
      DOZZLE_NO_ANALYTICS: "true"
      # Read containers via the socket proxy, not a mounted socket.
      DOZZLE_REMOTE_HOST: "tcp://docker-socket-proxy:2375"
    networks:
      - web          # reached by Caddy
      - monitoring   # reaches the socket proxy
    depends_on:
      - docker-socket-proxy

  beszel-hub:
    image: "henrygd/beszel:latest"
    container_name: "beszel-hub"
    restart: unless-stopped
    volumes:
      - beszel-hub-data:/beszel_data
    networks:
      - web          # reached by Caddy
      - monitoring   # reaches the agent

  beszel-agent:
    image: "henrygd/beszel-agent:latest"
    container_name: "beszel-agent"
    restart: unless-stopped
    # Opt-in: starts only with `--profile agent`, after you've set BESZEL_KEY.
    profiles: [ "agent" ]
    environment:
      # The hub authenticates to the agent with this ed25519 public KEY. Open the
      # beszel-hub UI, "Add system", copy the KEY into BESZEL_KEY in .env, then:
      #   docker compose -f docker-compose.monitoring.yml --profile agent up -d beszel-agent
      KEY: "${BESZEL_KEY:-}"
      LISTEN: "45876"
      # Read container stats via the socket proxy, not a mounted socket.
      DOCKER_HOST: "tcp://docker-socket-proxy:2375"
    # Reachable only by the hub on the internal network — no host port, no host
    # networking. Trade-off: host-level NIC/temperature metrics are reduced versus
    # the upstream host-network setup; container + CPU/mem/disk stats still report.
    networks:
      - monitoring
    depends_on:
      - docker-socket-proxy

volumes:
  uptime-kuma-data:
  beszel-hub-data:

networks:
  # Caddy-facing network (UIs only).
  web:
    external: true
  # Private network for the socket proxy + its consumers + hub↔agent. Not exposed.
  monitoring:
