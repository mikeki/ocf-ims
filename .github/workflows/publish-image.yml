# Build the production Docker image and publish it to the GitHub Container
# Registry (GHCR), so the deployment host pulls a prebuilt image instead of
# compiling on the box (see docs/deployment.md). The image is built by the same
# hermetic Dockerfile that CI already builds + tests in cicd.yml.

name: Publish image

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

defaults:
  run:
    shell: bash

jobs:

  publish:

    name: Build and push to GHCR

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      - name: Harden Runner
        uses: step-security/harden-runner@v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            *.docker.com:443
            *.docker.io:443
            *.golang.org:443
            cdn.datatables.net:443
            cdn.jsdelivr.net:443
            code.jquery.com:443
            dl-cdn.alpinelinux.org:443
            ghcr.io:443
            github.com:443
            pkg-containers.githubusercontent.com:443
            storage.googleapis.com:443

      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build, tag, and push
        env:
          # github.repository is "mikeki/ocf-ims" (already lowercase, as GHCR requires).
          # Pass workflow context through env (not inlined into the script) per
          # GitHub Actions injection-hardening guidance.
          IMAGE: "ghcr.io/${{ github.repository }}"
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: |
          docker build --tag "${IMAGE}:${SHA}" .
          docker push "${IMAGE}:${SHA}"
          # Move the rolling "latest" tag only for real master builds, so a
          # workflow_dispatch from a branch can't repoint production.
          if [[ "$REF" == "refs/heads/master" ]]; then
            docker tag "${IMAGE}:${SHA}" "${IMAGE}:latest"
            docker push "${IMAGE}:latest"
          fi
