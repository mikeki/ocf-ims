# Docs: https://docs.github.com/en/actions

name: CI/CD

permissions:
  contents: read

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]


defaults:
  run:
    shell: bash


jobs:

  lint:

    name: Linters

    runs-on: ubuntu-latest

    steps:

      - name: Harden Runner
        uses: step-security/harden-runner@v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            *.astral.sh:443
            *.github.com:443
            *.githubusercontent.com:443
            *.go.dev:443
            *.golang.org:443
            cdn.datatables.net:443
            cdn.jsdelivr.net:443
            code.jquery.com:443
            dl.google.com:443
            files.pythonhosted.org:443
            github.com:443
            go.dev:443
            golang.org:443
            pypi.org:443
            registry.npmjs.org:443
            storage.googleapis.com:443

      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: Set up pnpm
        # pnpm supplies the protoc-gen-es plugin for the buf TypeScript target
        # (buf.gen.web.yaml). The version comes from the packageManager field in
        # package.json. This is the only job that runs the TS proto codegen; the
        # `build` job has no pnpm, so build.go skips that target there.
        uses: pnpm/action-setup@v4

      - name: Generate code (sqlc, templ, tsgo, buf)
        # None of the generated code is committed, so it must be produced before
        # pre-commit's golangci-lint/govulncheck/go-vet compile ./.... build.go
        # -generate-only runs the generators (and fetches build deps) without the
        # final `go build`.
        run: go run bin/build/build.go -generate-only

      - name: Lint protobuf (buf)
        run: go tool buf lint

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Run pre-commit checks
        run: uvx pre-commit run --all-files


  build:

    name: Build application

    runs-on: ubuntu-latest

    steps:

      - name: Harden Runner
        uses: step-security/harden-runner@v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            *.codecov.io:443
            *.docker.com:443
            *.docker.io:443
            *.github.com:443
            *.githubusercontent.com:443
            *.golang.org:443
            *.sentry.io:443
            cdn.datatables.net:443
            cdn.jsdelivr.net:443
            code.jquery.com:443
            dl.google.com:443
            github.com:443
            go.dev:443
            golang.org:443
            keybase.io:443
            storage.googleapis.com:443

      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: Generate code (sqlc, templ, tsgo, buf)
        # None of the generated code is committed, so it must be produced before
        # `go test ./...` can compile any package that imports it. build.go
        # -generate-only runs the generators (and fetches build deps) without the
        # final `go build`. This job has no pnpm, so build.go generates the
        # hermetic Go proto targets (gen/) and skips the TypeScript target — the
        # latter is a client artifact, not a compile input for the server.
        run: go run bin/build/build.go -generate-only

      - name: Compile, test, and cover
        run: go test -race -covermode=atomic -coverprofile=coverage.txt --coverpkg ./... ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.txt
          env_vars: GITHUB_REF,GITHUB_COMMIT,GITHUB_USER,GITHUB_WORKFLOW
          fail_ci_if_error: false
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_COMMIT: ${{ github.sha }}
          GITHUB_USER: ${{ github.actor }}
          GITHUB_WORKFLOW: ${{ github.workflow }}


  docker-build:

    name: Build Docker image

    runs-on: ubuntu-latest
    # buf is compiled from source inside the golang:alpine build stage (a `go
    # tool` local), which adds ~4 min of one-time compilation to `build.go
    # -generate-only`. Give the job headroom over the old 10-minute limit.
    timeout-minutes: 15

    steps:

      - name: Harden Runner
        uses: step-security/harden-runner@v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            *.docker.com:443
            *.docker.io:443
            *.golang.org:443
            cdn.datatables.net:443
            cdn.jsdelivr.net:443
            code.jquery.com:443
            dl-cdn.alpinelinux.org:443
            github.com:443
            storage.googleapis.com:443

      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build --tag "ocf-ims:${{ github.sha }}" .

      - name: Save Docker image
        run: docker image save ocf-ims | gzip -9 > docker_image.tgz

      - name: Upload Docker image artifacts
        uses: actions/upload-artifact@v7
        with:
          name: docker
          path: docker_image.tgz


  docker-test:

    name: Test Docker image

    needs: [docker-build]

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      - name: Harden Runner
        uses: step-security/harden-runner@v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            *.docker.com:443
            *.docker.io:443
            *.golang.org:443
            cdn.datatables.net:443
            cdn.jsdelivr.net:443
            code.jquery.com:443
            dl-cdn.alpinelinux.org:443
            github.com:443
            storage.googleapis.com:443

      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Download Docker image artifacts
        uses: actions/download-artifact@v8
        with:
          name: docker

      - name: Load Docker image
        run: gzip --uncompress --stdout docker_image.tgz | docker image load

      - name: Test Docker image
        run: ./bin/test_docker
        env:
          IMAGE_TAG: ${{ github.sha }}


  docker-publish:

    name: Publish image to GHCR

    # Only publish an image that passed lint, the test suite, AND the docker
    # image test — and only from master pushes (PRs build + test but never push).
    needs: [lint, build, docker-test]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}

    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      packages: write

    steps:

      - name: Harden Runner
        uses: step-security/harden-runner@v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            *.docker.com:443
            *.docker.io:443
            *.golang.org:443
            cdn.datatables.net:443
            cdn.jsdelivr.net:443
            code.jquery.com:443
            dl-cdn.alpinelinux.org:443
            ghcr.io:443
            github.com:443
            pkg-containers.githubusercontent.com:443
            storage.googleapis.com:443

      - name: Download Docker image artifact
        uses: actions/download-artifact@v8
        with:
          name: docker

      - name: Load Docker image
        run: gzip --uncompress --stdout docker_image.tgz | docker image load

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Tag and push the tested image (no rebuild)
        env:
          # github.repository is "mikeki/ocf-ims" (lowercase, as GHCR requires).
          # Pass workflow context through env per injection-hardening guidance.
          IMAGE: "ghcr.io/${{ github.repository }}"
          SHA: ${{ github.sha }}
        run: |
          docker tag "ocf-ims:${SHA}" "${IMAGE}:${SHA}"
          docker tag "ocf-ims:${SHA}" "${IMAGE}:latest"
          docker push "${IMAGE}:${SHA}"
          docker push "${IMAGE}:latest"
