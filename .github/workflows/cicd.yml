# Docs: https://docs.github.com/en/actions

name: CI/CD

permissions:
  contents: read

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]


defaults:
  run:
    shell: bash


jobs:

  lint:

    name: Linters

    runs-on: ubuntu-latest

    steps:

      - name: Harden Runner
        uses: step-security/harden-runner@v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            *.astral.sh:443
            *.github.com:443
            *.githubusercontent.com:443
            *.go.dev:443
            *.golang.org:443
            cdn.datatables.net:443
            cdn.jsdelivr.net:443
            code.jquery.com:443
            dl.google.com:443
            files.pythonhosted.org:443
            github.com:443
            go.dev:443
            golang.org:443
            pypi.org:443
            registry.npmjs.org:443
            storage.googleapis.com:443

      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go/go.mod"

      - name: Set up pnpm
        # pnpm supplies the protoc-gen-es plugin for the buf TypeScript target
        # (buf.gen.web.yaml). The version comes from the packageManager field in
        # package.json. This is the only job that runs the TS proto codegen; the
        # `build` job has no pnpm, so build.go skips that target there.
        uses: pnpm/action-setup@v4

      - name: Generate code (sqlc, templ, tsgo, buf)
        # None of the generated code is committed, so it must be produced before
        # pre-commit's golangci-lint/govulncheck/go-vet compile ./.... build.go
        # -generate-only runs the generators (and fetches build deps) without the
        # final `go build`.
        working-directory: go
        run: go run bin/build/build.go -generate-only

      - name: Lint protobuf (buf)
        # buf runs from the go/ module root (that is where `go tool` resolves the
        # pinned buf), pointed up at the repo-root proto/ (plan 09f diverging roots).
        working-directory: go
        run: go tool buf lint ../proto

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Run pre-commit checks
        run: uvx pre-commit run --all-files


  interface:

    name: Interface

    # The Expo client (packages/interface, plan 09i E12): the same list a
    # developer runs from the repo root (packages/interface/README.md).
    # Store builds (EAS) never run here.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # The Expo CLI never phones home from CI: no telemetry, and offline mode
      # skips its version/SDK checks (api.expo.dev is not on the allow-list).
      EXPO_NO_TELEMETRY: "1"
      EXPO_OFFLINE: "1"
      CI: "1"

    steps:

      - name: Harden Runner
        uses: step-security/harden-runner@v2.19.4
        with:
          egress-policy: block
          # npm registry for pnpm; the Go hosts because `pnpm generate` runs
          # `go tool buf` from the module cache; Microsoft's Playwright CDN and
          # its fallback for `playwright install chromium`.
          allowed-endpoints: >
            *.github.com:443
            *.githubusercontent.com:443
            *.go.dev:443
            *.golang.org:443
            cdn.playwright.dev:443
            dl.google.com:443
            github.com:443
            go.dev:443
            golang.org:443
            playwright.download.prss.microsoft.com:443
            registry.npmjs.org:443
            storage.googleapis.com:443

      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Go
        # Only for `go tool buf`: the client's generated TypeScript comes from
        # the buf web template (buf.gen.web.yaml) via the root `pnpm generate`.
        uses: actions/setup-go@v6
        with:
          go-version-file: "go/go.mod"

      - name: Set up pnpm
        # Version from the packageManager field in package.json. Must precede
        # setup-node so the pnpm store cache can be keyed.
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate the proto TypeScript (buf, protoc-gen-es)
        # Generated code is never committed (see .gitignore); the client cannot
        # typecheck, test or bundle without it.
        run: pnpm generate

      - name: Typecheck (tsc)
        run: pnpm -F @ocf-ims/interface typecheck

      - name: Lint (biome, whole workspace)
        run: pnpm lint

      - name: Unit tests (jest-expo)
        run: pnpm -F @ocf-ims/interface test

      - name: Export the web build (expo export)
        run: pnpm -F @ocf-ims/interface export:web

      - name: Install Playwright's Chromium
        # The runner image already carries Chromium's shared libraries, so no
        # `--with-deps` (which would need apt egress).
        run: pnpm -F @ocf-ims/interface exec playwright install chromium

      - name: Web smoke (Playwright against the export)
        run: pnpm -F @ocf-ims/interface e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: packages/interface/playwright-report


  build:

    name: Build application

    runs-on: ubuntu-latest

    steps:

      - name: Harden Runner
        uses: step-security/harden-runner@v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            *.codecov.io:443
            *.docker.com:443
            *.docker.io:443
            *.github.com:443
            *.githubusercontent.com:443
            *.golang.org:443
            *.sentry.io:443
            cdn.datatables.net:443
            cdn.jsdelivr.net:443
            code.jquery.com:443
            dl.google.com:443
            github.com:443
            go.dev:443
            golang.org:443
            keybase.io:443
            storage.googleapis.com:443

      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go/go.mod"

      - name: Generate code (sqlc, templ, tsgo, buf)
        # None of the generated code is committed, so it must be produced before
        # `go test ./...` can compile any package that imports it. build.go
        # -generate-only runs the generators (and fetches build deps) without the
        # final `go build`. This job has no pnpm, so build.go generates the
        # hermetic Go proto targets (gen/) and skips the TypeScript target — the
        # latter is a client artifact, not a compile input for the server.
        working-directory: go
        run: go run bin/build/build.go -generate-only

      - name: Compile, test, and cover
        working-directory: go
        run: go test -race -covermode=atomic -coverprofile=coverage.txt --coverpkg ./... ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: go/coverage.txt
          env_vars: GITHUB_REF,GITHUB_COMMIT,GITHUB_USER,GITHUB_WORKFLOW
          fail_ci_if_error: false
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_COMMIT: ${{ github.sha }}
          GITHUB_USER: ${{ github.actor }}
          GITHUB_WORKFLOW: ${{ github.workflow }}


  docker-build:

    name: Build Docker image

    runs-on: ubuntu-latest
    # buf is compiled from source inside the golang:alpine build stage (a `go
    # tool` local), which adds ~4 min of one-time compilation to `build.go
    # -generate-only`. Give the job headroom over the old 10-minute limit.
    timeout-minutes: 15

    steps:

      - name: Harden Runner
        uses: step-security/harden-runner@v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            *.docker.com:443
            *.docker.io:443
            *.golang.org:443
            cdn.datatables.net:443
            cdn.jsdelivr.net:443
            code.jquery.com:443
            dl-cdn.alpinelinux.org:443
            github.com:443
            storage.googleapis.com:443

      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build --tag "ocf-ims:${{ github.sha }}" .

      - name: Save Docker image
        run: docker image save ocf-ims | gzip -9 > docker_image.tgz

      - name: Upload Docker image artifacts
        uses: actions/upload-artifact@v7
        with:
          name: docker
          path: docker_image.tgz


  docker-test:

    name: Test Docker image

    needs: [docker-build]

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      - name: Harden Runner
        uses: step-security/harden-runner@v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            *.docker.com:443
            *.docker.io:443
            *.golang.org:443
            cdn.datatables.net:443
            cdn.jsdelivr.net:443
            code.jquery.com:443
            dl-cdn.alpinelinux.org:443
            github.com:443
            storage.googleapis.com:443

      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Download Docker image artifacts
        uses: actions/download-artifact@v8
        with:
          name: docker

      - name: Load Docker image
        run: gzip --uncompress --stdout docker_image.tgz | docker image load

      - name: Test Docker image
        run: ./go/bin/test_docker
        env:
          IMAGE_TAG: ${{ github.sha }}


  docker-publish:

    name: Publish image to GHCR

    # Only publish an image that passed lint, the test suite, AND the docker
    # image test — and only from master pushes (PRs build + test but never push).
    needs: [lint, build, docker-test]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}

    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      packages: write

    steps:

      - name: Harden Runner
        uses: step-security/harden-runner@v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            *.docker.com:443
            *.docker.io:443
            *.golang.org:443
            cdn.datatables.net:443
            cdn.jsdelivr.net:443
            code.jquery.com:443
            dl-cdn.alpinelinux.org:443
            ghcr.io:443
            github.com:443
            pkg-containers.githubusercontent.com:443
            storage.googleapis.com:443

      - name: Download Docker image artifact
        uses: actions/download-artifact@v8
        with:
          name: docker

      - name: Load Docker image
        run: gzip --uncompress --stdout docker_image.tgz | docker image load

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Tag and push the tested image (no rebuild)
        env:
          # github.repository is "mikeki/ocf-ims" (lowercase, as GHCR requires).
          # Pass workflow context through env per injection-hardening guidance.
          IMAGE: "ghcr.io/${{ github.repository }}"
          SHA: ${{ github.sha }}
        run: |
          docker tag "ocf-ims:${SHA}" "${IMAGE}:${SHA}"
          docker tag "ocf-ims:${SHA}" "${IMAGE}:latest"
          docker push "${IMAGE}:${SHA}"
          docker push "${IMAGE}:latest"
