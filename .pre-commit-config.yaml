ci:
  skip:
    - fetch-build-deps
    - golangci-lint-full
    - govulncheck
    - prepend-license
    - go-fmt
    - go-mod-tidy
    - go-vet

repos:

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=700']
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-xml
      - id: check-yaml
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: forbid-submodules
      - id: mixed-line-ending
      # - id: no-commit-to-branch
      - id: trailing-whitespace

  # The Go module lives under go/ (plan 09f). pre-commit runs from the repo root
  # (where .git is), so every Go check cd's into go/ first — that also makes
  # `go env GOMOD` resolve to go/go.mod for tools that self-locate (prependlicense).
  # golangci-lint is a local `go run` at the pinned version (it is not a go tool in
  # go.mod, and the hosted hook cannot target a nested module).
  - repo: local
    hooks:
      - id: golangci-lint-full
        name: golangci-lint
        entry: bash -c 'cd go && exec go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 run --config=.golangci.yml'
        language: system
        types_or: [ go, go-mod, go-sum ]
        pass_filenames: false

      - id: fetch-build-deps
        name: fetch build deps
        entry: bash -c 'cd go && exec go run bin/fetchbuilddeps/fetchbuilddeps.go'
        language: system
        pass_filenames: false

      - id: prepend-license
        name: prepend license
        # This program implicitly only operates on specific file types, which
        # are configured within the program itself, hence no "types_or" here.
        entry: bash -c 'cd go && exec go run bin/prependlicense/prependlicense.go'
        language: system
        pass_filenames: false

      - id: govulncheck
        name: govulncheck
        entry: bash -c 'cd go && exec go tool govulncheck ./...'
        language: system
        types_or: [ go, go-mod, go-sum ]
        pass_filenames: false

      - id: go-fmt
        name: go fmt
        entry: bash -c 'cd go && exec go fmt ./...'
        language: system
        types_or: [ go, go-mod, go-sum ]
        pass_filenames: false

      - id: go-vet
        name: go vet
        entry: bash -c 'cd go && exec go vet ./...'
        language: system
        types_or: [ go, go-mod, go-sum ]
        pass_filenames: false

      - id: go-mod-tidy
        name: go mod tidy
        entry: bash -c 'cd go && exec go mod tidy'
        language: system
        types_or: [ go, go-mod, go-sum ]
        pass_filenames: false
