# This docker-compose brings up a local live-reloading IMS server and IMS DB.
#
# `docker compose -f docker-compose.dev.yml up`
#
# Here's some helpful information:
#
# 1. The server will rebuild and restart on any code update, thanks to air.
# 2. When the compose stack is first brought up, the IMS database will be created,
#    DDLed to the latest schema, then seeded with data for local development
#    (including the local PERSON directory). Search for "docker-entrypoint-initdb.d"
#    below for more info.
# 3. If you ever want to delete the database and start fresh, then you just need to
#    delete ./.docker/mysql/data-ims/, and the stack will re-create and re-seed the
#    database when you next `docker compose up`.

services:

  ims-go:
    # This uses a Go hot-reload program: https://github.com/air-verse/air
    # If you want to rebuild this image (e.g. because you're updating
    # the go version in go.mod), then run the following:
    #  docker compose -f docker-compose.dev.yml build --no-cache
    build:
      context: .
      dockerfile: dev.Dockerfile
    image: "ims-go-air"
    container_name: "ocf-ims"

    # Map the repo into a directory in the container.
    working_dir: /src
    volumes:
      - ./:/src/

    # IMS server configuration starts with
    # 1. DefaultIMS in imsconfig.go, which is overridden by
    # 2. ./.env file, if present, which is overridden by
    # 3. The environment values here.
    environment:
      # The user directory is the local IMS-DB PERSON table, seeded from
      # store/fakeimsdb/seed.sql. See docs/plans/32-retire-clubhouse.md. Demo
      # logins: Miguel / ShadowDancer / TeamMember (password == handle).
      #
      # The bind-mounted /src often has a UID that doesn't match the in-container
      # user, which trips git's "dubious ownership" check and makes `go build`
      # fail with "error obtaining VCS status: exit status 128". Disable VCS
      # stamping for the dev binary so air can build without git access.
      GOFLAGS: "-buildvcs=false"
      IMS_HOSTNAME: "0.0.0.0"
      IMS_PORT: "8080"
      IMS_DB_HOST_NAME: "ims-db"
      IMS_DB_PORT: "3306"
      IMS_DB_USER_NAME: "${IMS_DB_USER_NAME:-ims}"
      IMS_DB_PASSWORD: "${IMS_DB_PASSWORD:-ims}"
    ports:
      # Override IMS_HOST_PORT to set the port mapping on the host.
      - "${IMS_HOST_PORT:-8090}:8080"
    networks:
      - default
      - maybloom-proxy
    depends_on:
      ims-db:
        condition: service_healthy

  ims-db:
    image: "mariadb:10.5.27"
    container_name: "ranger-ims-db"
    environment:
      MARIADB_DATABASE: "${IMS_DB_DATABASE:-ims}"
      MARIADB_USER: "${IMS_DB_USER_NAME:-ims}"
      MARIADB_PASSWORD: "${IMS_DB_PASSWORD:-ims}"
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    ports:
      - "3306"
    volumes:
      - ./.docker/mysql/data-ims/:/var/lib/mysql
      - ./store/schema/current.sql:/docker-entrypoint-initdb.d/1.schema.sql
      - ./store/fakeimsdb/seed.sql:/docker-entrypoint-initdb.d/2.seed.sql
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 1s
      timeout: 5s
      retries: 10

networks:
  maybloom-proxy:
    external: true
