# This docker-compose brings up a local live-reloading IMS server and IMS DB.
#
# `docker compose -f docker-compose.dev.yml up`
#
# Here's some helpful information:
#
# 1. The server will rebuild and restart on any code update, thanks to air.
# 2. The app owns the schema and the seed: on boot it runs goose migrations and,
#    because IMS_SEED=demo is set below, loads the dev seed (local PERSON
#    directory + demo data) into an empty database. Both are idempotent, so a
#    restart against a populated database is a no-op. (There are no
#    docker-entrypoint-initdb.d scripts — the app, not MariaDB, sets everything
#    up.)
# 3. If you ever want to delete the database and start fresh, then you just need to
#    delete ./.docker/mysql/data-ims/, and the app will re-migrate and re-seed the
#    database when you next `docker compose up`.

services:

  ims-go:
    # This uses a Go hot-reload program: https://github.com/air-verse/air
    # If you want to rebuild this image (e.g. because you're updating
    # the go version in go.mod), then run the following:
    #  docker compose -f docker-compose.dev.yml build --no-cache
    build:
      context: .
      dockerfile: dev.Dockerfile
    image: "ims-go-air"
    container_name: "ocf-ims"
    # Survive host reboots (the host auto-reboots ~02:00 for kernel upgrades).
    restart: unless-stopped

    # Map the repo into a directory in the container.
    working_dir: /src
    volumes:
      - ./:/src/

    # IMS server configuration starts with
    # 1. DefaultIMS in imsconfig.go, which is overridden by
    # 2. ./.env file, if present, which is overridden by
    # 3. The environment values here.
    environment:
      # The user directory is the local IMS-DB PERSON table. IMS_SEED=demo makes
      # the app load store/fakeimsdb/seed.sql into an empty DB on boot (idempotent
      # — see store.Seed). Demo logins: Miguel / ShadowDancer / TeamMember
      # (password == handle). See docs/plans/32-retire-clubhouse.md and
      # docs/plans/08-db-migration-tooling.md.
      IMS_SEED: "demo"
      #
      # The bind-mounted /src often has a UID that doesn't match the in-container
      # user, which trips git's "dubious ownership" check and makes `go build`
      # fail with "error obtaining VCS status: exit status 128". Disable VCS
      # stamping for the dev binary so air can build without git access.
      GOFLAGS: "-buildvcs=false"
      IMS_HOSTNAME: "0.0.0.0"
      IMS_PORT: "8080"
      IMS_DB_HOST_NAME: "ims-db"
      IMS_DB_PORT: "3306"
      IMS_DB_USER_NAME: "${IMS_DB_USER_NAME:-ims}"
      IMS_DB_PASSWORD: "${IMS_DB_PASSWORD:-ims}"
      # Sessions (6q). The refresh token is the felt session length; give it 7 days
      # so it isn't the limit people hit. IMS_JWT_SECRET signs the tokens, and its
      # default is random *per boot* — so without a stable value, every restart
      # (air rebuilds + the nightly reboot) logs everyone out. Set a stable secret
      # on the HOST (a gitignored .env beside this file, or the shell env):
      #   IMS_JWT_SECRET=<long random string>
      # Leave it unset for throwaway local dev and a fresh random one is used each
      # boot (the empty passthrough below falls back to that default).
      IMS_TOKEN_LIFETIME: "604800"
      IMS_JWT_SECRET: "${IMS_JWT_SECRET:-}"
      # Disable HTTP caching in dev so rebuilt JS/CSS propagate without a hard
      # refresh. The static cache-buster (?v=…) is a constant ("deadbeef") in dev
      # because git VCS stamping is off, so a non-zero cache TTL serves stale JS
      # for up to its lifetime after every `air` rebuild.
      IMS_CACHE_CONTROL_SHORT: "0s"
      IMS_CACHE_CONTROL_LONG: "0s"
    ports:
      # Override IMS_HOST_PORT to set the port mapping on the host.
      - "${IMS_HOST_PORT:-8090}:8080"
    networks:
      - default
      - maybloom-proxy
    depends_on:
      ims-db:
        condition: service_healthy

  ims-db:
    image: "mariadb:10.5.27"
    container_name: "ranger-ims-db"
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: "${IMS_DB_DATABASE:-ims}"
      MARIADB_USER: "${IMS_DB_USER_NAME:-ims}"
      MARIADB_PASSWORD: "${IMS_DB_PASSWORD:-ims}"
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    ports:
      - "3306"
    volumes:
      - ./.docker/mysql/data-ims/:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 1s
      timeout: 5s
      retries: 10

networks:
  maybloom-proxy:
    external: true
