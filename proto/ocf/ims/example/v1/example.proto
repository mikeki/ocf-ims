// Package ocf.ims.example.v1 is a THROWAWAY proto used only to prove the codegen
// toolchain (plan 09, slice 0a): it exercises every generator target — Go
// messages, connect-go handlers/clients, TypeScript, and OpenAPI. It carries no
// real API surface and is deleted when slice 0b lands the first real resources.
syntax = "proto3";

package ocf.ims.example.v1;

option go_package = "github.com/mikeki/ocf-ims/gen/ocf/ims/example/v1;examplev1";

import "google/protobuf/timestamp.proto";

// Example is a placeholder message. Timestamps are google.protobuf.Timestamp,
// never epoch numbers — the contract convention from the first file (plan 09).
message Example {
  string id = 1;
  string name = 2;
  google.protobuf.Timestamp created = 3;
}

// ExampleService exists only so the connect-go and OpenAPI generators have a
// service to emit from.
service ExampleService {
  // Ping is a trivial unary RPC.
  rpc Ping(PingRequest) returns (PingResponse) {}
}

message PingRequest {
  string message = 1;
}

message PingResponse {
  string message = 1;
}
