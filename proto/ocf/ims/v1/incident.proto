syntax = "proto3";

package ocf.ims.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/burningmantech/ranger-ims-go/gen/ocf/ims/v1;imsv1";

// IncidentService is the proto-first contract for incidents. It is the OCF IMS
// API expressed as a typed interface; Connect-Go handlers implement it over the
// existing store/ layer, alongside (not replacing) the current REST API.
//
// First cut: read-only. Mutations (create/update, add involvement, etc.) come as
// the surface grows.
service IncidentService {
  // List all incidents for one event.
  rpc ListIncidents(ListIncidentsRequest) returns (ListIncidentsResponse);
  // Fetch a single incident by its per-event number.
  rpc GetIncident(GetIncidentRequest) returns (GetIncidentResponse);
}

message ListIncidentsRequest {
  // Event NAME (the URL slug), e.g. "OCF 2026". Events partition all data; an
  // incident's number is unique only within its event.
  string event = 1;
}

message ListIncidentsResponse {
  repeated Incident incidents = 1;
}

message GetIncidentRequest {
  string event = 1;
  int32 number = 2;
}

message GetIncidentResponse {
  Incident incident = 1;
}

// IncidentState mirrors the store enum: new/on_hold/dispatched/on_scene/closed.
enum IncidentState {
  INCIDENT_STATE_UNSPECIFIED = 0;
  INCIDENT_STATE_NEW = 1;
  INCIDENT_STATE_ON_HOLD = 2;
  INCIDENT_STATE_DISPATCHED = 3;
  INCIDENT_STATE_ON_SCENE = 4;
  INCIDENT_STATE_CLOSED = 5;
}

// IncidentPriority replaces the legacy magic ints (high=5, normal=3, low=1) with
// a named enum; handlers map to/from the stored value.
enum IncidentPriority {
  INCIDENT_PRIORITY_UNSPECIFIED = 0;
  INCIDENT_PRIORITY_LOW = 1;    // legacy stored value: 1
  INCIDENT_PRIORITY_NORMAL = 2; // legacy stored value: 3
  INCIDENT_PRIORITY_HIGH = 3;   // legacy stored value: 5
}

message Location {
  // Nilable so a client can distinguish "set to empty" from "unset".
  optional string name = 1;
  optional string address = 2;
  optional string description = 3;
}

// PersonInvolvement is a Person attached to an incident and how they were
// involved. Renamed from the old IncidentRanger{handle, role}:
//   - keyed on the stable person_id (was the loose RANGER_HANDLE string),
//   - nickname is the human-facing, changeable label (was "handle"/callsign),
//   - involvement is the free-text "how involved" (was the "role" field; "role"
//     is now reserved for permissions).
message PersonInvolvement {
  int64 person_id = 1;
  string nickname = 2;
  optional string involvement = 3;
}

message Attachment {
  string name = 1;
  bool previewable = 2;
}

message ReportEntry {
  int32 id = 1;
  google.protobuf.Timestamp created = 2;
  // The Person who wrote this entry (the old AUTHOR handle).
  string author_nickname = 3;
  bool system_entry = 4;
  string text = 5;
  optional bool stricken = 6;
  Attachment attachment = 7;
}

message LinkedIncident {
  string event = 1;
  int32 event_id = 2;
  int32 number = 3;
  string summary = 4;
}

message Incident {
  string event = 1; // event NAME (URL slug)
  int32 event_id = 2;
  int32 number = 3;
  google.protobuf.Timestamp created = 4;
  google.protobuf.Timestamp last_modified = 5;
  IncidentState state = 6;
  google.protobuf.Timestamp started = 7;
  google.protobuf.Timestamp closed = 8;
  IncidentPriority priority = 9;
  optional string summary = 10;
  Location location = 11;
  repeated int32 incident_type_ids = 12;
  // Renamed from "field_reports": the IDs of Reports linked to this incident.
  repeated int32 reports = 13;
  repeated int32 visits = 14;
  // Renamed from "rangers": the People involved in this incident.
  repeated PersonInvolvement people_involved = 15;
  repeated LinkedIncident linked_incidents = 16;
  repeated ReportEntry report_entries = 17;
}
