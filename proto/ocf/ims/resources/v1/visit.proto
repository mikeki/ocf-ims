syntax = "proto3";

package ocf.ims.resources.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "ocf/ims/common/v1/person_ref.proto";
import "ocf/ims/resources/v1/journal_entry.proto";

option go_package = "github.com/mikeki/ocf-ims/gen/ocf/ims/resources/v1;resourcesv1";

// Visit is a White Bird sanctuary visit (the VISIT table, keyed (EVENT, NUMBER)).
// Mirrors json.Visit. The Visits UI is intentionally disabled for 2026 (#61) while the
// backend stays intact; it is modelled here to complete resources/v1 before 0e, since
// Incident.visits already references visit ids.
//
// json.Visit carried guest identity as a write id (guest_person_id, where <= 0 clears
// the link) plus read-only resolved guest_name/guest_handle. The contract collapses that
// into a single guest PersonRef (person_id on write, handle/name read echoes), the same
// way JournalEntry handles mentions. The other guest_* fields are freeform text typed
// into the visit, not registry data. arrival_time/departure_time were epoch doubles;
// the contract uses Timestamp.
message Visit {
  string event = 1;
  int32 event_id = 2;
  int32 number = 3;
  google.protobuf.Timestamp created = 4;
  google.protobuf.Timestamp last_modified = 5;
  // incident is the linked incident number, if any.
  optional int32 incident = 6;

  // guest links the visit to a PERSON (person_id on write; handle/name are read
  // echoes, resolved from the linked PERSON — preferred name now lives on PERSON.NAME).
  optional ocf.ims.common.v1.PersonRef guest = 7;

  optional string guest_legal_name = 8 [(buf.validate.field).string.max_len = 128];
  optional string guest_description = 9 [(buf.validate.field).string.max_len = 256];
  optional string guest_action_plan = 10 [(buf.validate.field).string.max_len = 512];
  optional string guest_camp_name = 11 [(buf.validate.field).string.max_len = 256];
  optional string guest_camp_address = 12 [(buf.validate.field).string.max_len = 256];
  optional string guest_camp_description = 13 [(buf.validate.field).string.max_len = 256];
  optional string guest_camp_contacts = 14 [(buf.validate.field).string.max_len = 512];

  optional google.protobuf.Timestamp arrival_time = 15;
  optional string arrival_method = 16 [(buf.validate.field).string.max_len = 256];
  optional string arrival_state = 17 [(buf.validate.field).string.max_len = 256];
  optional string arrival_reason = 18 [(buf.validate.field).string.max_len = 256];
  optional string arrival_belongings = 19 [(buf.validate.field).string.max_len = 256];

  optional google.protobuf.Timestamp departure_time = 20;
  optional string departure_method = 21 [(buf.validate.field).string.max_len = 256];
  optional string departure_state = 22 [(buf.validate.field).string.max_len = 256];

  optional string resource_sitter = 23 [(buf.validate.field).string.max_len = 256];
  optional string resource_bed_id = 24 [(buf.validate.field).string.max_len = 64];
  optional string resource_rest = 25 [(buf.validate.field).string.max_len = 256];
  optional string resource_clothes = 26 [(buf.validate.field).string.max_len = 256];
  optional string resource_pogs = 27 [(buf.validate.field).string.max_len = 256];
  optional string resource_food_bev = 28 [(buf.validate.field).string.max_len = 256];
  optional string resource_other = 29 [(buf.validate.field).string.max_len = 256];

  repeated VisitPerson people = 30;
  repeated JournalEntry journal_entries = 31;
}

// VisitPerson is a person's involvement in a visit (the VISIT__PERSON table). Mirrors
// json.VisitPerson; person_id standardized to int32 (as elsewhere in the contract).
message VisitPerson {
  int32 person_id = 1;
  optional string handle = 2 [(buf.validate.field).string.max_len = 64];
  optional string name = 3 [(buf.validate.field).string.max_len = 255];
  optional string involvement = 4 [(buf.validate.field).string.max_len = 128];
}
