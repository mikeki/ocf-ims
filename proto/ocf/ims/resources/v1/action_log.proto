syntax = "proto3";

package ocf.ims.resources.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/mikeki/ocf-ims/gen/ocf/ims/resources/v1;resourcesv1";

// ActionLog is one audit record of a mutating request (the ACTION_LOG table; see
// store/actionlog). Mirrors json.ActionLog. It captures metadata only — never request
// or response bodies — so credential payloads are never logged. Read-only, admin-gated.
//
// json.ActionLog named the actor user_id/user_name after the ACTION_LOG columns; the
// contract uses "person" to match the rest of the domain. person_id/person_name are a
// point-in-time snapshot of who acted (the id and the name as it read then), not a live
// PersonRef — an audit record must not imply a resolvable, current reference. person_id
// is int32 like the rest of the contract (the bigint column only ever holds a
// PERSON.ID). id stays int64: the log's own row id in an append-only, high-volume table.
// The former POSITION_ID/POSITION_NAME columns are not surfaced — positions are not an
// implemented feature (no assignment path exists), so they are always empty here.
message ActionLog {
  int64 id = 1;
  google.protobuf.Timestamp created_at = 2;
  // action_type is a free string, "api" for every current record (kept a string rather
  // than an enum until a closed set of types actually exists).
  string action_type = 3;
  optional string method = 4;
  optional string path = 5;
  optional string referrer = 6;
  optional int32 person_id = 7;
  string person_name = 8;
  optional string client_ip_address = 9;
  // http_status is the response status (json.ActionLog stored it as int16; proto has no
  // 16-bit type, so int32).
  optional int32 http_status = 10;
  // duration is a formatted duration string (e.g. "1.2ms"), as in json.ActionLog.
  optional string duration = 11;
}
