syntax = "proto3";

package ocf.ims.service.rpc.v1;

import "buf/validate/validate.proto";
import "ocf/ims/resources/v1/crew.proto";

option go_package = "github.com/mikeki/ocf-ims/gen/ocf/ims/service/rpc/v1;servicerpcv1";

// Request/response envelopes for the crew RPCs (declared in ../../v1/service.proto).
//
// The REST POST /crews multiplexes create/rename, delete, and a single-member
// mutation on one json.Crew body (via its delete/member write-selectors). The RPC
// surface splits that into explicit calls (0c decision: crew delete/member become
// RPCs, not resource fields). Create and update are separate RPCs — as everywhere
// else in the service (incidents, reports, personnel, areas, taxonomies) — rather
// than one upsert; there is no `Save*`/upsert form anywhere in ImsService.

message ListCrewsRequest {
  int32 event_id = 1 [(buf.validate.field).int32.gt = 0];
}

message ListCrewsResponse {
  repeated ocf.ims.resources.v1.Crew crews = 1;
}

// CreateCrewRequest creates a crew (the server generates its slug). Membership is
// not touched here.
message CreateCrewRequest {
  int32 event_id = 1 [(buf.validate.field).int32.gt = 0];
  ocf.ims.resources.v1.Crew crew = 2;
}

// CreateCrewResponse returns the server-generated slug (the per-event key), as
// CreateArea returns area_slug.
message CreateCrewResponse {
  string crew_slug = 1;
}

// UpdateCrewRequest renames / reorders an existing crew (admin-only). Membership is
// not touched here.
message UpdateCrewRequest {
  int32 event_id = 1 [(buf.validate.field).int32.gt = 0];
  string crew_slug = 2 [(buf.validate.field).string.min_len = 1];
  ocf.ims.resources.v1.Crew crew = 3;
}

message UpdateCrewResponse {}

message DeleteCrewRequest {
  int32 event_id = 1 [(buf.validate.field).int32.gt = 0];
  string crew_slug = 2 [(buf.validate.field).string.min_len = 1];
}

message DeleteCrewResponse {}

// SetCrewMembershipRequest is one membership mutation (json.CrewMemberEdit): remove,
// or add/update with a leader flag. Admin-gated.
message SetCrewMembershipRequest {
  int32 event_id = 1 [(buf.validate.field).int32.gt = 0];
  string crew_slug = 2 [(buf.validate.field).string.min_len = 1];
  int32 person_id = 3 [(buf.validate.field).int32.gt = 0];
  bool remove = 4;
  bool is_leader = 5;
}

message SetCrewMembershipResponse {}

// ListMyCrews / SetMyCrewMembership are the crew-leader self-service pair (slice 10c):
// the caller reads/edits only crews they lead (authz is leadership, checked in the
// handler), distinct from the admin crew RPCs above.
message ListMyCrewsRequest {
  int32 event_id = 1 [(buf.validate.field).int32.gt = 0];
}

message ListMyCrewsResponse {
  repeated ocf.ims.resources.v1.Crew crews = 1;
}

message SetMyCrewMembershipRequest {
  int32 event_id = 1 [(buf.validate.field).int32.gt = 0];
  string crew_slug = 2 [(buf.validate.field).string.min_len = 1];
  int32 person_id = 3 [(buf.validate.field).int32.gt = 0];
  bool remove = 4;
  bool is_leader = 5;
}

message SetMyCrewMembershipResponse {}
