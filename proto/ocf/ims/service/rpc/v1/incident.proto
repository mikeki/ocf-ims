syntax = "proto3";

package ocf.ims.service.rpc.v1;

import "buf/validate/validate.proto";
import "ocf/ims/resources/v1/incident.proto";
import "ocf/ims/resources/v1/journal_entry.proto";

option go_package = "github.com/mikeki/ocf-ims/gen/ocf/ims/service/rpc/v1;servicerpcv1";

// Request/response envelopes for the incident RPCs (declared in ../../v1/service.proto).

// IncidentView wraps the Incident resource with the one caller-dependent, read-only
// decoration 0b kept off the resource: viewer_may_add_journal, a flag about the
// *caller*. Per-involved-person read-only flags (has_event_access) are flags about
// each person, so they live on the resource's IncidentPerson, not here. Response-only.
message IncidentView {
  ocf.ims.resources.v1.Incident incident = 1;
  // viewer_may_add_journal (52f): the caller may append journal entries (event
  // writer, or an involved reporter with a per-incident grant).
  bool viewer_may_add_journal = 2;
}

message ListIncidentsRequest {
  int32 event_id = 1 [(buf.validate.field).int32.gt = 0];
}

message ListIncidentsResponse {
  repeated IncidentView incidents = 1;
}

message GetIncidentRequest {
  int32 event_id = 1 [(buf.validate.field).int32.gt = 0];
  int32 incident_number = 2 [(buf.validate.field).int32.gt = 0];
}

message GetIncidentResponse {
  IncidentView incident = 1;
}

// CreateIncidentRequest carries the whole resource (Phase-0 rule). Server-assigned
// fields on the incident (number, created, last_modified) are ignored on create.
message CreateIncidentRequest {
  int32 event_id = 1 [(buf.validate.field).int32.gt = 0];
  ocf.ims.resources.v1.Incident incident = 2;
}

// CreateIncidentResponse returns the server-assigned per-event incident number.
message CreateIncidentResponse {
  int32 incident_number = 1;
}

message UpdateIncidentRequest {
  int32 event_id = 1 [(buf.validate.field).int32.gt = 0];
  int32 incident_number = 2 [(buf.validate.field).int32.gt = 0];
  ocf.ims.resources.v1.Incident incident = 3;
}

message UpdateIncidentResponse {}

// AttachPersonToIncidentRequest mirrors the json.IncidentPerson write body plus the
// path keys. granted_access is writer-gated (52f).
message AttachPersonToIncidentRequest {
  int32 event_id = 1 [(buf.validate.field).int32.gt = 0];
  int32 incident_number = 2 [(buf.validate.field).int32.gt = 0];
  int32 person_id = 3 [(buf.validate.field).int32.gt = 0];
  optional string involvement = 4 [(buf.validate.field).string.max_len = 128];
  bool granted_access = 5;
}

message AttachPersonToIncidentResponse {}

message DetachPersonFromIncidentRequest {
  int32 event_id = 1 [(buf.validate.field).int32.gt = 0];
  int32 incident_number = 2 [(buf.validate.field).int32.gt = 0];
  int32 person_id = 3 [(buf.validate.field).int32.gt = 0];
}

message DetachPersonFromIncidentResponse {}

// UpdateIncidentJournalEntryRequest edits an existing entry (e.g. strike/unstrike);
// new entries are added via UpdateIncident. entry carries the mutable fields.
message UpdateIncidentJournalEntryRequest {
  int32 event_id = 1 [(buf.validate.field).int32.gt = 0];
  int32 incident_number = 2 [(buf.validate.field).int32.gt = 0];
  int32 journal_entry_id = 3 [(buf.validate.field).int32.gt = 0];
  ocf.ims.resources.v1.JournalEntry entry = 4;
}

message UpdateIncidentJournalEntryResponse {}
