syntax = "proto3";

package ocf.ims.service.rpc.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "ocf/ims/common/v1/incident_ref.proto";
import "ocf/ims/resources/v1/incident.proto";
import "ocf/ims/resources/v1/journal_entry.proto";

option go_package = "github.com/mikeki/ocf-ims/gen/ocf/ims/service/rpc/v1;servicerpcv1";

// Request/response envelopes for the incident RPCs (declared in ../../v1/service.proto).

// IncidentView wraps the Incident resource with the one caller-dependent, read-only
// decoration 0b kept off the resource: viewer_may_add_journal, a flag about the
// *caller*. Per-involved-person read-only flags (has_event_access) are flags about
// each person, so they live on the resource's IncidentPerson, not here. Response-only.
message IncidentView {
  ocf.ims.resources.v1.Incident incident = 1;
  // viewer_may_add_journal (52f): the caller may append journal entries (event
  // writer, or an involved reporter with a per-incident grant).
  bool viewer_may_add_journal = 2;
}

message ListIncidentsRequest {
  int32 event_id = 1 [(buf.validate.field).int32.gt = 0];
  // exclude_system_entries drops the generated ("system") journal entries from each
  // incident in the list — the list view renders summaries, not full journals, so it
  // asks for the lighter payload (the REST list read carried this as a query param).
  // Default false includes them, matching a single GetIncident read.
  bool exclude_system_entries = 2;
}

message ListIncidentsResponse {
  repeated IncidentView incidents = 1;
}

message GetIncidentRequest {
  int32 event_id = 1 [(buf.validate.field).int32.gt = 0];
  int32 incident_number = 2 [(buf.validate.field).int32.gt = 0];
}

message GetIncidentResponse {
  IncidentView incident = 1;
}

// Int32List / IncidentRefList wrap a repeated field so an update can distinguish
// "leave this list unchanged" (the optional wrapper is absent) from "set the list to
// exactly these, clearing it when empty" (the wrapper is present). Plain `repeated`
// can't express that difference — an absent and an empty repeated field are identical
// on the wire — and the incident write relies on it (a partial edit that touches only
// the types must not clobber the reports/links it omits).
message Int32List {
  repeated int32 values = 1;
}

message IncidentRefList {
  // Only event_id + incident_number are read on write; the display fields are ignored.
  repeated ocf.ims.common.v1.IncidentRef refs = 1;
}

// NewJournalEntry is a journal entry to append: its author-typed text and the person
// ids @mentioned in it. The resource JournalEntry models the read echo (server-assigned
// id/author/created, resolved mentions); this is the minimal write shape.
message NewJournalEntry {
  string text = 1;
  repeated int32 mentioned_person_ids = 2;
}

// IncidentUpdate is the write body shared by CreateIncident and UpdateIncident — the
// two run identical field-application logic (REST NewIncident created the row then
// delegated to the edit path), so they share one message rather than the raw Incident
// resource. Every field is presence-tracked: an absent scalar/list leaves that field
// unchanged, a present one sets it (a present-but-empty Int32List/IncidentRefList
// clears the list). This is what lets a partial edit — "set only the types" — not
// clobber the reports and links it omits. On create the fields are applied over a fresh
// incident, so an absent field takes the create default (state OPEN, priority NORMAL,
// empty lists). Two deviations from the 0e "writes carry the resource" default, both
// forced by the write path: (1) the resource's plain `repeated` can't carry list
// presence; (2) the resource JournalEntry has no write-side mentioned_person_ids.
message IncidentUpdate {
  // UNSPECIFIED leaves the field unchanged (there is no "clear" for these — an
  // incident always has a state and a priority).
  ocf.ims.resources.v1.IncidentState state = 1 [(buf.validate.field).enum.defined_only = true];
  optional bool private = 2;
  // outcome_id: absent leaves it unchanged, 0 clears it, a positive id sets it.
  optional int32 outcome_id = 3;
  // started: absent leaves it unchanged.
  google.protobuf.Timestamp started = 4;
  ocf.ims.resources.v1.IncidentPriority priority = 5 [(buf.validate.field).enum.defined_only = true];
  optional string summary = 6 [(buf.validate.field).string.max_len = 1024];
  // location: absent touches nothing; a present location updates only its set fields
  // (each is itself optional, and an empty string clears that piece).
  ocf.ims.resources.v1.IncidentLocation location = 7;
  optional Int32List incident_type_ids = 8;
  optional Int32List reports = 9;
  optional IncidentRefList linked_incidents = 10;
  repeated NewJournalEntry journal_entries = 11;
}

// CreateIncidentRequest applies an IncidentUpdate to a fresh incident in the event.
message CreateIncidentRequest {
  int32 event_id = 1 [(buf.validate.field).int32.gt = 0];
  IncidentUpdate incident = 2;
}

// CreateIncidentResponse returns the server-assigned per-event incident number.
message CreateIncidentResponse {
  int32 incident_number = 1;
}

message UpdateIncidentRequest {
  int32 event_id = 1 [(buf.validate.field).int32.gt = 0];
  int32 incident_number = 2 [(buf.validate.field).int32.gt = 0];
  IncidentUpdate update = 3;
}

message UpdateIncidentResponse {}

// AttachPersonToIncidentRequest mirrors the json.IncidentPerson write body plus the
// path keys. granted_access is writer-gated (52f).
message AttachPersonToIncidentRequest {
  int32 event_id = 1 [(buf.validate.field).int32.gt = 0];
  int32 incident_number = 2 [(buf.validate.field).int32.gt = 0];
  int32 person_id = 3 [(buf.validate.field).int32.gt = 0];
  optional string involvement = 4 [(buf.validate.field).string.max_len = 128];
  bool granted_access = 5;
}

message AttachPersonToIncidentResponse {}

message DetachPersonFromIncidentRequest {
  int32 event_id = 1 [(buf.validate.field).int32.gt = 0];
  int32 incident_number = 2 [(buf.validate.field).int32.gt = 0];
  int32 person_id = 3 [(buf.validate.field).int32.gt = 0];
}

message DetachPersonFromIncidentResponse {}

// UpdateIncidentJournalEntryRequest edits an existing entry (e.g. strike/unstrike);
// new entries are added via UpdateIncident. entry carries the mutable fields.
message UpdateIncidentJournalEntryRequest {
  int32 event_id = 1 [(buf.validate.field).int32.gt = 0];
  int32 incident_number = 2 [(buf.validate.field).int32.gt = 0];
  int32 journal_entry_id = 3 [(buf.validate.field).int32.gt = 0];
  ocf.ims.resources.v1.JournalEntry entry = 4;
}

message UpdateIncidentJournalEntryResponse {}
