syntax = "proto3";

package ocf.ims.service.rpc.v1;

import "ocf/ims/resources/v1/event.proto";

option go_package = "github.com/mikeki/ocf-ims/gen/ocf/ims/service/rpc/v1;servicerpcv1";

// Request/response envelopes for the event RPCs (declared in ../../v1/service.proto).

message ListEventsRequest {}

message ListEventsResponse {
  repeated ocf.ims.resources.v1.Event events = 1;
}

// SaveEventRequest upserts an event (POST /events; the admin Events page creates
// events). Kept a single upsert (event.id == 0 creates, else updates) rather than
// split Create/Update: the caller identifies the event by name and the numeric id is
// a surrogate the server returns. Carries the whole resource per the Phase-0 rule.
message SaveEventRequest {
  ocf.ims.resources.v1.Event event = 1;
}

// SaveEventResponse returns the event's id — the server assigns it on create (REST
// returned it in the IMS-Event-ID header, which an empty response would have
// dropped); echoed on update.
message SaveEventResponse {
  int32 event_id = 1;
}
