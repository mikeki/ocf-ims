syntax = "proto3";

package ocf.ims.service.rpc.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/mikeki/ocf-ims/gen/ocf/ims/service/rpc/v1;servicerpcv1";

// The live stream (plan 09p 3b.0b), the first server-streaming RPC in the
// contract (declared in ../../v1/service.proto). For Connect clients it replaces
// the SSE poke at GET /ims/api/eventsource, which stays for the templ UI until
// Phase 4. SSE is a broadcast and must redact a private incident's number; a
// stream is per-subscriber and filters instead, so the "something changed"
// residual goes away.

message WatchEventRequest {
  // Explicit rather than "everything you can read": an enumerated list is
  // auditable where an implicit one is not.
  repeated int32 event_ids = 1 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 64,
    (buf.validate.field).repeated.items.int32.gt = 0
  ];
}

// A poke names what changed; it never carries the thing itself.
enum EventPokeKind {
  EVENT_POKE_KIND_UNSPECIFIED = 0;

  // Sent immediately on subscribe (it establishes the stream) and every 25 s
  // after, so an idle connection is not reaped by a proxy.
  EVENT_POKE_KIND_HEARTBEAT = 1;

  // incident_number is set.
  EVENT_POKE_KIND_INCIDENT_CHANGED = 2;

  // report_number is set.
  EVENT_POKE_KIND_REPORT_CHANGED = 3;
}

// The envelope buf's RPC_RESPONSE_STANDARD_NAME rule wants. It can grow a
// resume cursor without touching the poke.
message WatchEventResponse {
  EventPoke poke = 1;
}

// The client refetches through the access-gated reads (GetIncident, GetReport).
// Carrying content here would put authorization on the publish path — a second
// implementation of "may this person see this".
message EventPoke {
  EventPokeKind kind = 1;

  // Zero on a heartbeat.
  int32 event_id = 2;

  optional int32 incident_number = 3;

  optional int32 report_number = 4;

  // On a heartbeat this is the only content; it lets a client notice a stream
  // that is open but stalled.
  google.protobuf.Timestamp sent = 5;
}
