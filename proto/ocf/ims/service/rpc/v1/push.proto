syntax = "proto3";

package ocf.ims.service.rpc.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/mikeki/ocf-ims/gen/ocf/ims/service/rpc/v1;servicerpcv1";

// Request/response envelopes for the web-push RPCs (declared in ../../v1/service.proto).
//
// Web-push subscriptions (plan 84): per-person, per-device, so only authentication is
// required. api.PushSubscribeRequest nests keys under a "keys" object; the contract
// flattens them to p256dh/auth.

message SubscribePushRequest {
  string endpoint = 1 [(buf.validate.field).string.min_len = 1];
  string p256dh = 2 [(buf.validate.field).string.min_len = 1];
  string auth = 3 [(buf.validate.field).string.min_len = 1];
}

message SubscribePushResponse {}

message UnsubscribePushRequest {
  string endpoint = 1 [(buf.validate.field).string.min_len = 1];
}

message UnsubscribePushResponse {}

// Native (Expo) devices (plan 09p 3b.0c). Separate RPCs from the Subscribe /
// UnsubscribePush pair: a browser subscription is a URL plus two crypto keys, an
// Expo device is one opaque token, and one message would make three of its four
// fields conditional. Both share PUSH_SUBSCRIPTION (ENDPOINT, told apart by KIND).

message RegisterPushDeviceRequest {
  // The ExponentPushToken[...] Expo issued to this install. The prefix is
  // pinned so a raw APNs or FCM token is rejected here rather than accepted and
  // never delivered.
  string expo_push_token = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 512,
    (buf.validate.field).string.prefix = "ExponentPushToken["
  ];
}

message RegisterPushDeviceResponse {}

message UnregisterPushDeviceRequest {
  string expo_push_token = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 512
  ];
}

message UnregisterPushDeviceResponse {}
