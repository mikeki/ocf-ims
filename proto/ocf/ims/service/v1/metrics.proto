syntax = "proto3";

package ocf.ims.service.v1;

import "buf/validate/validate.proto";
import "ocf/ims/resources/v1/metrics.proto";

option go_package = "github.com/mikeki/ocf-ims/gen/ocf/ims/service/v1;servicev1";

message GetMetricsRequest {
  string event_name = 1 [(buf.validate.field).string.min_len = 1];
}

message GetMetricsResponse {
  ocf.ims.resources.v1.Metrics metrics = 1;
}
