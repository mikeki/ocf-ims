syntax = "proto3";

package ocf.ims.service.v1;

import "ocf/ims/resources/v1/action_log.proto";

option go_package = "github.com/mikeki/ocf-ims/gen/ocf/ims/service/v1;servicev1";

// ListActionLogsRequest is the admin audit read (GET /actionlogs). No filters are
// exposed by the REST endpoint today; kept empty (add pagination/filters here when
// the endpoint grows them).
message ListActionLogsRequest {}

message ListActionLogsResponse {
  repeated ocf.ims.resources.v1.ActionLog action_logs = 1;
}
