syntax = "proto3";

package ocf.ims.service.v1;

import "buf/validate/validate.proto";
import "ocf/ims/resources/v1/incident_type.proto";

option go_package = "github.com/mikeki/ocf-ims/gen/ocf/ims/service/v1;servicev1";

message ListIncidentTypesRequest {}

message ListIncidentTypesResponse {
  repeated ocf.ims.resources.v1.IncidentType incident_types = 1;
}

// SaveIncidentTypeRequest is the admin create/edit/approve write (POST /incident_types;
// api.EditIncidentTypes reads one json.IncidentType). To approve, an admin sends id +
// approved=true.
message SaveIncidentTypeRequest {
  ocf.ims.resources.v1.IncidentType incident_type = 1;
}

message SaveIncidentTypeResponse {}

// ProposeIncidentTypeRequest is a writer's proposal from the incident form. The route
// is event-scoped only to authorize the caller as a writer; the type itself is global.
message ProposeIncidentTypeRequest {
  string event_name = 1 [(buf.validate.field).string.min_len = 1];
  ocf.ims.resources.v1.IncidentType incident_type = 2;
}

message ProposeIncidentTypeResponse {}
