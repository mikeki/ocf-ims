syntax = "proto3";

package ocf.ims.service.v1;

import "buf/validate/validate.proto";
import "ocf/ims/resources/v1/area.proto";

option go_package = "github.com/mikeki/ocf-ims/gen/ocf/ims/service/v1;servicev1";

message ListAreasRequest {
  string event_name = 1 [(buf.validate.field).string.min_len = 1];
}

message ListAreasResponse {
  repeated ocf.ims.resources.v1.Area areas = 1;
}

// SaveAreaRequest handles the single-area write (propose / approve / rename / merge);
// api.EditAreas reads one json.Area per call.
message SaveAreaRequest {
  string event_name = 1 [(buf.validate.field).string.min_len = 1];
  ocf.ims.resources.v1.Area area = 2;
}

message SaveAreaResponse {}
